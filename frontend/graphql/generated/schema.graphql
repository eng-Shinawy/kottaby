type Mutation {
  adjustTeacherWallet(input: AdjustTeacherWalletInput!): TeacherTransaction!

  """
  Broadcasts an admin-authored announcement to the audience selected server-side and returns the persisted recipient count.
  """
  adminBroadcastNotification(input: AdminBroadcastNotificationInput!): Int!

  """
  Cancel one session and release its held fee to the original lane (admin-only; pre-terminal rows only). Keyed retries with the same X-Idempotency-Key header are no-ops returning the current row — never a duplicate audit row nor a second refund.
  """
  adminCancelSession(input: AdminSessionCancelInput!): Session!

  """
  Cancels an active subscription while preserving its balance lanes untouched. Admin-only; a replay of an already-applied cancel surfaces an idempotent conflict instead of a second write.
  """
  adminCancelSubscription(
    """The active subscription selector and an optional bounded reason."""
    input: CancelSubscriptionInput!
  ): StudentSubscription!

  """
  Admin-only cold-start certification (INV-TV1(b) / FR-3.9): promotes an existing teacher-role user to a certified founding Sheikh — inserts or elevates the teacher row (is_approved=true, is_evaluator per flag), finalizes any applicants row (passed, cooldown cleared), appends one override audit row, and notifies the teacher. Repeat calls answer TEACHER_ALREADY_CERTIFIED.
  """
  adminCertifyTeacherColdStart(makeEvaluator: Boolean = true, userId: Int!): AdminUserDetail!

  """
  Changes an active subscription onto a different active plan in the same balance lane with prorated settlement: the old row is cancelled, the owner's lane is settled to the prepared exact total (target plan's session count plus the computed carry on upgrades; the remainder forfeited on downgrades), and a fresh period opens on the target plan. Admin-only; a duplicate change replays the first result.
  """
  adminChangeSubscriptionPlan(
    """The active subscription selector and the target plan id."""
    input: ChangeSubscriptionPlanInput!
  ): ChangeSubscriptionPlanPayload!
  adminCreateUser(input: AdminCreateUserInput!): AdminUserDetail!

  """
  Extends an active subscription's validity window by a whole number of days. Admin-only; the new window end is derived server-side from the row's current end date.
  """
  adminExtendSubscription(
    """The subscription selector and the day count to add."""
    input: ExtendSubscriptionInput!
  ): StudentSubscription!

  """
  Join one started session as a read-only observer (admin-only, audit-only — no session column changes). Rows that are not started are SESSION_INVALID_TRANSITION conflicts with zero audit rows.
  """
  adminJoinSession(input: AdminSessionJoinInput!): Session!
  adminOnboardStudentWithOfflinePayment(input: AdminOnboardStudentOfflineInput!): AdminOnboardStudentResult!

  """
  Reassign one scheduled session to a different certified teacher (admin-only; scheduled rows only). The candidate's certification is asserted under lock — an unapproved candidate is TEACHER_NOT_CERTIFIED and leaves the row untouched.
  """
  adminReassignTeacher(input: AdminSessionReassignInput!): Session!

  """
  Renews an expired subscription into a fresh active period: a new row (same owner, fresh plan snapshot), the owner's lane credited the plan's full session count, and the student junction row. Admin-only; a duplicate renew replays the first result.
  """
  adminRenewSubscription(
    """The expired subscription selector."""
    input: RenewSubscriptionInput!
  ): StudentSubscription!

  """
  Reschedule one session's timing pair (admin-only guarded transition; scheduled/started rows only). Ordering and the past-grace window are validated before any read; zero-row misses are SESSION_INVALID_TRANSITION conflicts.
  """
  adminRescheduleSession(input: AdminSessionRescheduleInput!): Session!
  adminSetUserBlocked(blocked: Boolean!, id: Int!): AdminUserDetail!
  adminSetUserDeleted(deleted: Boolean!, id: Int!): AdminUserDetail!
  adminSetUserSuspended(id: Int!, periodDays: Int, suspended: Boolean!): AdminUserDetail!

  """
  Stops an active broadcast (one-way active → stopped transition, engine-mediated recipient retraction) and returns the retracted notification count.
  """
  adminStopBroadcast(broadcastId: Int!): Int!
  adminUpdateUser(id: Int!, input: AdminUpdateUserInput!): AdminUserDetail!
  approveWithdrawal(transactionId: ID!): TeacherTransaction!

  """
  Book one evaluation session as an applicant. BOLA-proof: identity from session.
  """
  bookEvaluationSession(input: BookEvaluationSessionInput!): Session!

  """
  Withdraws exactly one of the caller's own pending link requests (silent fold — zero notifications). A foreign or nonexistent id is indistinguishable — PARENT_LINK_REQUEST_NOT_FOUND with no existence oracle.
  """
  cancelParentLinkRequest(requestId: ID!): OutgoingParentLinkRequest!

  """
  Cancel one of the caller's scheduled/started sessions (either participant) and release the held fee to its original lane. Non-participants and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials.
  """
  cancelSession(id: ID!, reason: String): Session!

  """
  Complete one of the caller's started sessions (teacher-only; certification is re-asserted inside the guarded UPDATE).
  """
  completeSession(id: ID!): Session!

  """
  Confirm a completed session as its student (the teacher's stamp is written by completion), completing the dual confirmation: the escrow hold is consumed and the teacher's wallet is credited exactly once. Repeat confirms, the teacher caller, and arbitration-settled rows are idempotent no-ops returning the current row. Non-participants and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials.
  """
  confirmSessionCompletion(id: ID!): Session!

  """
  Creates a new lesson, optionally tied to a subscription plan (Admin only).
  """
  createLesson(
    """Input fields for the new lesson."""
    input: CreateLessonInput!
  ): Lesson!

  """Creates a new subscription plan in the catalog (Admin only)."""
  createPlan(
    """Input fields for the new subscription plan."""
    input: CreatePlanInput!
  ): Plan!

  """
  Book one session against a certified teacher. Student-only; the booking is idempotent per the X-Idempotency-Key request header (a replayed key surfaces DUPLICATE_REQUEST).
  """
  createSession(input: CreateSessionInput!): Session!

  """
  Deletes an existing lesson and returns the removed row for cache eviction (Admin only).
  """
  deleteLesson(
    """ID of the lesson to delete."""
    id: ID!
  ): Lesson!

  """
  Authenticate with email + password. Returns the authenticated user + access + refresh tokens. The access_token + refresh_token + session_id are also set as httpOnly cookies.
  """
  login(email: String!, password: String!): LoginPayload!

  """
  Clears the access_token + refresh_token + session_id httpOnly cookies. Public — callable with an expired token. Always returns { success: true }.
  """
  logout: LogoutPayload!

  """
  Marks every unread notification of the caller read (optionally narrowed to one type) and returns the affected-row count. An empty matching set returns 0; repeat sweeps are idempotent (0).
  """
  markAllNotificationsRead(type: NotificationType): Int!

  """
  Marks one of the caller's own notifications read (idempotent) and returns the row. A foreign or nonexistent id is indistinguishable — NOTIFICATION_NOT_FOUND with no existence oracle.
  """
  markNotificationRead(id: ID!): Notification!

  """
  Open a post-confirmation dispute on one of the caller's dual-confirmed sessions (student-only, exactly once, with a required reason). Non-students and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials; a row that is not a confirmed completion with its escrow consumed is a SESSION_INVALID_TRANSITION conflict. The row waits in the disputed state for admin arbitration.
  """
  openPostConfirmationDispute(id: ID!, reason: String!): Session!

  """
  Open a dispute on one of the caller's scheduled/started sessions (either participant, exactly once, with a required reason). Non-participants and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials; the row waits in the disputed state for admin arbitration.
  """
  openSessionDispute(id: ID!, reason: String!): Session!

  """
  Purchase a subscription plan for the caller: opens the gateway checkout session and commits the pending subscription + payment pair atomically (a failed purchase never burns its idempotency key). Replaying the same X-Idempotency-Key surfaces DUPLICATE_REQUEST. Returns the pending pair plus the checkout descriptor. Student-only.
  """
  purchaseSubscription(input: PurchaseSubscriptionInput!): PurchaseSubscriptionPayload!

  """
  Purchase the teacher verification plan; identity from the session, plan resolved server-side.
  """
  purchaseVerificationPlan: PurchaseSubscriptionPayload!

  """
  Rotate the JWT pair from a valid refresh token. Returns fresh access + refresh tokens. The new access_token + refresh_token + session_id are also set as httpOnly cookies (rotation invalidates the prior pair).
  """
  refreshToken(refreshToken: String!): RefreshTokenPayload!
  registerUser(input: RegisterUserInput!): User!
  rejectWithdrawal(reason: String!, transactionId: ID!): TeacherTransaction!

  """
  Submits a parent-child link request for the student owning the handshake code. A valid-format code matching no eligible student answers null (missing and governance-excluded are indistinguishable); already-linked and already-pending targets surface their dedicated conflicts.
  """
  requestParentChildLink(code: String!): OutgoingParentLinkRequest

  """
  Request a payout from the caller's own teacher wallet: one pending withdrawal ledger row plus a guarded balance debit, atomically. Insufficient funds roll the request back (zero rows) and surface WALLET_INSUFFICIENT_FUNDS; malformed amounts fail the pre-DB validation matrix with WALLET_INVALID_AMOUNT. Returns the UPDATED wallet (balance + refreshed ledger) so no refetch is needed. Teacher-only.
  """
  requestWithdrawal(input: RequestWithdrawalInput!): Wallet!

  """
  Resolve one disputed session into exactly one terminal state (admin arbitration over both dispute generations, dispatched by outcome family): Cancel refunds the held fee to its original lane, Complete consumes the hold (never-started disputes are rejected), Refund reverses the consumed fee to the teacher's wallet and restores the student's lane credit, PartialRefund reverses only the validated partialAmount, Uphold completes the session untouched. Held-escrow rows reject the consumed-family outcomes and vice versa (disputeResolutionMismatch). Non-disputed rows are SESSION_INVALID_TRANSITION conflicts.
  """
  resolveSessionDispute(id: ID!, note: String, partialAmount: String, resolution: DisputeResolution!): Session!

  """
  Accepts or rejects exactly one of the caller's own pending link requests (one-directional claim). A foreign or nonexistent id is indistinguishable — PARENT_LINK_REQUEST_NOT_FOUND with no existence oracle; already-resolved and expired requests surface their dedicated conflicts.
  """
  respondToParentLinkRequest(accept: Boolean!, requestId: ID!): IncomingParentLinkRequest!

  """Activates or deactivates an existing subscription plan (Admin only)."""
  setPlanActiveStatus(
    """ID of the subscription plan."""
    id: ID!

    """Target active state for the plan."""
    isActive: Boolean!
  ): Plan!
  setSessionRecitation(input: SessionRecitationInput!, sessionId: ID!): SessionRecitation!

  """
  Start one of the caller's scheduled sessions (teacher-only guarded transition).
  """
  startSession(id: ID!): Session!

  """
  Submit the calling evaluator's rubric for one of their completed teacher_evaluation sessions. Write-once per (session, evaluator). Teacher-only.
  """
  submitRubricEvaluation(input: RubricEvaluationSubmitInput!, sessionId: ID!): RubricEvaluation!

  """
  Submit the teacher's report for one completed session: notes, the student rating, and the optional homework composites (previous-row grades + the new assignment) settle atomically. A duplicate submission replays SESSION_REPORT_ALREADY_EXISTS.
  """
  submitSessionReport(id: ID!, input: SubmitSessionReportInput!): SessionReport!

  """
  Submit the calling student's rating of one session's teacher: a whole-star 1..5 rating stored on the 0-100 score scale, exactly once per session. An unfinished handshake surfaces EVALUATION_SESSION_NOT_COMPLETED, a re-submission EVALUATION_ALREADY_SUBMITTED, and an unknown or foreign session is indistinguishable from SESSION_NOT_FOUND. Student-only.
  """
  submitTeacherEvaluation(input: SubmitTeacherEvaluationInput!, sessionId: ID!): Evaluation!

  """Updates mutable fields on an existing lesson (Admin only)."""
  updateLesson(
    """ID of the lesson to update."""
    id: ID!

    """Updated fields for the lesson."""
    input: UpdateLessonInput!
  ): Lesson!

  """
  Persists the caller's app locale preference (UI + notification-copy language) and returns the updated user. Idempotent. Self-scoped — identity is derived from the verified context, never from arguments.
  """
  updateMyLocale(locale: AppLocale!): User!

  """Updates mutable fields on an existing subscription plan (Admin only)."""
  updatePlan(
    """ID of the subscription plan to update."""
    id: ID!

    """Updated fields for the subscription plan."""
    input: UpdatePlanInput!
  ): Plan!
}

