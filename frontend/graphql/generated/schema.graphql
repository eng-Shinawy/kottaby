  myRubricPendingSessions(page: Int, pageSize: Int): SessionPage!
  myStudentSessions(filter: SessionListFilterInput, page: Int = 1, pageSize: Int = 25): SessionPage!

  """
  The caller's own subscriptions across every lifecycle status, newest first. Student-only.
