"""
Input for changing an active subscription onto a different plan in the same balance lane.
"""
input ChangeSubscriptionPlanInput {
  """
  ID of the target plan (must be active and credit the same balance lane; server-guarded).
  """
  newPlanId: ID!

  """ID of the active subscription row to re-plan."""
  subscriptionId: ID!
}

"""
Result of an admin plan change: the new subscription row and the applied proration settlement.
"""
type ChangeSubscriptionPlanPayload {
  """
  Sessions carried on top of the target plan's full session count (upgrades only; zero on downgrades and replays).
  """
  carrySessions: Int!

  """
  Derived direction from the two plans' per-session unit values (a unit-value tie breaks on session count).
  """
  direction: ProrationDirection!

  """
  Remaining sessions forfeited by a downgrade (zero on upgrades and replays) — ids/ints vocabulary mirrors the audit row.
  """
  forfeitedSessions: Int!

  """
  The NEW active subscription row on the target plan (the first change's row on a replay).
  """
  subscription: StudentSubscription!
}

