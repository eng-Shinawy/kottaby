  mySubscriptions: [StudentSubscription!]!
  myTeacherEvaluations: [Evaluation!]!
  myTeacherSessions(filter: SessionListFilterInput, page: Int = 1, pageSize: Int = 25): SessionPage!

  """
  The caller's unread notification count — the badge read (0 for an all-read or empty inbox).
  """
  myUnreadNotificationCount: Int!

  """
  The caller's own teacher wallet: the balance surface (decimal strings, EGP) plus the newest-first ledger page (the 50 most recent transactions). The wallet row is ensured lazily, so a new teacher sees an honest zeroed wallet. Teacher-only.
  """
  myWallet: Wallet!

  """
  One newest-first page of the caller's own teacher ledger (the paginated companion of `myWallet`). The window is clamped server-side to the documented envelope (limit 1..50, offset >= 0) and the payload carries the pagination truth (totalCount + hasMore). Teacher-only; the wallet address is the verified context identity — there is no caller-supplied lookup surface.
  """
  myWalletLedger(limit: Int!, offset: Int!): WalletLedgerPage!

  """
  The gated child's homework rows (each carrying the two parallel Jadid/Madi track blocks), newest-session-first, paged. Track block composition preserves per-field nullability — a null grade stays null, a fully-null track block collapses to null, never fabricated zeros.
  """
  parentChildHomework(page: Int, pageSize: Int, studentId: Int!): ParentHomeworkPage!

  """
  The gated child header echo plus the honest progress row count and the latest Jadid/Madi curriculum positions, in one payload. The link grant is verified inside the same transaction as the reads; a missing, foreign, never-linked, severed, or malformed student id collapses to the same constant denial.
  """
  parentChildProgress(studentId: Int!): ParentChildProgress!

  """
  The gated child's per-session report rows (teacher notes + rating, joined to the owning session for status/timestamp context), newest-session-first, paged. The honest total + page window shape mirrors the attendance list; an out-of-range page yields empty items next to the true total count.
  """
  parentChildReports(page: Int, pageSize: Int, studentId: Int!): ParentReportPage!

  """
  The gated child's derived attendance entries (session rows), newest first, paged. Pagination is normalized before the database read and the effective values are echoed in the page payload; an out-of-range page yields empty items next to the true total count.
  """
  parentChildSessions(page: Int, pageSize: Int, studentId: Int!): ParentAttendancePage!

  """
  The closed id pair resolving one completion-notification session pointer: the session id plus the linked child who owns it. A missing or foreign session is indistinguishable on the wire — both collapse to the same constant denial (existence non-disclosure); a non-positive session id is rejected as a validation failure before any gate or read. The deep-link landing route is constructed from the pair alone.
  """
  parentSessionTarget(sessionId: Int!): ParentSessionTarget!

  """Returns the active subscription plans catalog for authenticated users."""
  planCatalog: [Plan!]!

  """Returns the curriculum lessons of a plan for authenticated users."""
  planLessons(
    """The id of the plan whose lessons are listed."""
    planId: ID!
  ): [Lesson!]!

  """
  Returns the canonical list of recitation readings (Qira'at) for the registration form selector. Public — no authentication required. The values are stable API identifiers; display labels are resolved client-side via the i18n recitation namespace.
