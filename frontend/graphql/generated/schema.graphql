  """
  The caller's own homework rows (each carrying the two parallel Jadid/Madi track blocks), newest-session-first, paged. Track block composition preserves per-field nullability — a null grade stays null, a fully-null track block collapses to null, never fabricated zeros.
  """
  myHomework(page: Int = 1, pageSize: Int = 25): ParentHomeworkPage!

  """
  Lists the link requests addressed to the caller (newest first, capped). Rows keep their post-resolution status; expired rows are rendered without any write.
  """
  myIncomingParentLinkRequests: [IncomingParentLinkRequest!]!

  """
  The caller's confirmed-linked children, oldest first. Soft-deleted children are excluded; a child whose account is severed vanishes from the list on the next read. Zero arguments — identity is derived exclusively from the verified context.
  """
  myLinkedChildren: [ParentLinkedChild!]!

  """
  One page of the caller's own inbox — items (newest first), totalCount, hasMore. Optional conjunctive filters (type, isRead) and page window (limit 1..50 default 20, offset default 0).
