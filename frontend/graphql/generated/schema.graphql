"""A recorded payment a student made for a subscription."""
type StudentPayment {
  """Exact paid amount as a decimal string (money is never a number)."""
  amount: String!

  """Timestamp when the payment record was created."""
  createdAt: String!

  """Three-letter ISO currency code the payment was collected in."""
  currency: String!

  """Unique payment identifier (Apollo cache normalization key)."""
  id: ID!

  """Gateway the payment traveled."""
  paymentGateway: PaymentGateway!

  """
  Settlement state — pending until the gateway decision marks it paid or failed.
  """
  status: PaymentStatus!

  """
  ID of the subscription the payment was made for, or null if the link was severed.
  """
  subscriptionId: Int

  """Timestamp when the payment record was last modified."""
  updatedAt: String!
}

"""A student subscription linking a purchaser to a catalog plan."""
type StudentSubscription {
  """
  How many audit-trail entries the trail holds for this subscription (the admin drawer's per-row trail-depth badge). Read-only; a row with no history answers 0.
  """
  auditEntriesCount: Int!

  """
  The most recent audit-trail entry for this subscription (the drawer's trail teaser), or null when the trail holds no entries for the row.
  """
  auditTrailPeek: StudentSubscriptionAuditPeek

  """Timestamp when the subscription record was created."""
  createdAt: String!

  """Timestamp the subscription period ends, or null while pending."""
  endDate: String

  """Unique subscription identifier (Apollo cache normalization key)."""
  id: ID!

  """Gateway the payment traveled, or null when no gateway is involved yet."""
  paymentMethod: PaymentGateway

  """
  Gateway-issued payment reference, or null for offline payments without one.
  """
  paymentReference: String

  """Timestamp the payment was verified, or null while unverified."""
  paymentVerifiedAt: String

  """
  The catalog plan this subscription grants (the resolved row always exists — restrict FK).
  """
  plan: Plan!

  """ID of the catalog plan this subscription grants."""
  planId: Int!

  """Timestamp the subscription period began, or null while pending."""
  startDate: String

  """
  Lifecycle state — purchases start pending; activation moves them to active.
  """
  status: SubscriptionStatus!

  """Timestamp when the subscription record was last modified."""
  updatedAt: String!
}

"""
The most recent audit-trail entry for one subscription (the drawer's trail teaser).
"""
type StudentSubscriptionAuditPeek {
  """
  Canonical action type of the most recent trail entry (fail-closed certified server-side).
  """
  actionType: AuditActionType!

  """Timestamp of the most recent trail entry (ISO-8601 UTC)."""
  at: String!
}

