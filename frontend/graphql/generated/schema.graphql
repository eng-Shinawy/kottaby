"""A subscription plan in the Kottaby catalog."""
type Plan {
  """Timestamp when the plan record was created."""
  createdAt: String!

  """Three-letter ISO currency code (e.g. EGP, USD)."""
  currency: String!

  """Timestamp when the plan was deactivated, or null if currently active."""
  deactivatedAt: String

  """Unique plan identifier (Apollo cache normalization key)."""
  id: ID!

  """Duration of the billing/service cycle in days."""
  intervalDays: Int!

  """
  Flag indicating whether this plan is actively offered in the student catalog.
  """
  isActive: Boolean!

  """Plan price represented as an exact decimal string."""
  price: String!

  """Number of lesson sessions included in this plan."""
  sessionCount: Int!

  """Human-readable title of the subscription plan."""
  title: String!

  """Timestamp when the plan record was last modified."""
  updatedAt: String!
}

type Query {
  _health: HealthCheck!
  adminAuditLogs(filters: AdminAuditLogFiltersInput, page: Int, pageSize: Int): AdminAuditLogPage!
  adminDisputedSessions(filter: SessionListFilterInput, limit: Int = 25, offset: Int = 0): SessionPage!

  """Admin-only query to list plans, optionally including inactive plans."""
  adminPlans(
    """Whether to include deactivated plans in the returned list."""
    includeInactive: Boolean = true
  ): [Plan!]!
  adminUserActivity(id: Int!, limit: Int): [AdminUserActivityEntry!]!
  adminUserDetail(id: Int!): AdminUserDetail!
  adminUserStats: AdminUserStats!
  adminUsers(filters: AdminUserFiltersInput, page: Int, pageSize: Int): AdminUserPage!
  findStudentByHandshakeCode(code: String!): HandshakeCodeLookup

  """
  Returns the authenticated user (or null for anonymous). Anonymous callers receive null — the AuthProvider uses this to detect expired access tokens and silently restore the session via `refreshToken`.
  """
  me: User
  myApplicantProfile: ApplicantProfile
  myHandshakeCode: String!

  """
  Lists the link requests addressed to the caller (newest first, capped). Rows keep their post-resolution status; expired rows are rendered without any write.
  """
  myIncomingParentLinkRequests: [IncomingParentLinkRequest!]!

  """
  One page of the caller's own inbox — items (newest first), totalCount, hasMore. Optional conjunctive filters (type, isRead) and page window (limit 1..50 default 20, offset default 0).
  """
  myNotifications(filter: MyNotificationsFilterInput): NotificationListPage!

  """
  Lists the caller's own parent-child link requests (newest first, capped). Rows keep their post-resolution status; expired rows are rendered without any write.
  """
  myOutgoingParentLinkRequests: [OutgoingParentLinkRequest!]!
  myStudentSessions(filter: SessionListFilterInput, page: Int = 1, pageSize: Int = 25): SessionPage!
  myTeacherSessions(filter: SessionListFilterInput, page: Int = 1, pageSize: Int = 25): SessionPage!

  """
  The caller's unread notification count — the badge read (0 for an all-read or empty inbox).
  """
  myUnreadNotificationCount: Int!

  """
  The caller's own teacher wallet: the balance surface (decimal strings, EGP) plus the newest-first ledger page (the 50 most recent transactions). The wallet row is ensured lazily, so a new teacher sees an honest zeroed wallet. Teacher-only.
  """
  myWallet: Wallet!

  """Returns the active subscription plans catalog for authenticated users."""
  planCatalog: [Plan!]!

  """
  Returns the canonical list of recitation readings (Qira'at) for the registration form selector. Public — no authentication required. The values are stable API identifiers; display labels are resolved client-side via the i18n recitation namespace.
  """
  recitationReadings: [RecitationReading!]!
  sessionById(id: ID!): Session
}

