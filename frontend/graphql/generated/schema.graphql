  recitationReadings: [RecitationReading!]!
  sessionById(id: ID!): Session
  sessionHomework(sessionId: ID!): SessionHomeWork
  sessionRecitation(sessionId: ID!): SessionRecitation
  sessionReport(sessionId: ID!): SessionReport

