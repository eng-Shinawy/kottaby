type LoginPayload {
  """
  Short-lived access token (15 min). Store in React memory; NEVER set as a cookie.
  """
  accessToken: String!

  """
  Long-lived refresh token (7 days). Also set as an httpOnly cookie by the route handler.
  """
  refreshToken: String!

  """The authenticated user."""
  user: User!
}

type LogoutPayload {
  """Whether the logout succeeded (always true — public mutation)."""
  success: Boolean!
}

type Mutation {
  """
  Broadcasts an admin-authored announcement to the audience selected server-side and returns the persisted recipient count.
  """
  adminBroadcastNotification(input: AdminBroadcastNotificationInput!): Int!
  adminCreateUser(input: AdminCreateUserInput!): AdminUserDetail!
  adminSetUserDeleted(deleted: Boolean!, id: Int!): AdminUserDetail!
  adminUpdateUser(id: Int!, input: AdminUpdateUserInput!): AdminUserDetail!

  """
  Withdraws exactly one of the caller's own pending link requests (silent fold — zero notifications). A foreign or nonexistent id is indistinguishable — PARENT_LINK_REQUEST_NOT_FOUND with no existence oracle.
  """
  cancelParentLinkRequest(requestId: ID!): OutgoingParentLinkRequest!

  """
  Cancel one of the caller's scheduled/started sessions (either participant) and release the held fee to its original lane. Non-participants and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials.
  """
  cancelSession(id: ID!, reason: String): Session!

  """
  Complete one of the caller's started sessions (teacher-only; certification is re-asserted inside the guarded UPDATE).
  """
  completeSession(id: ID!): Session!

  """
  Confirm a completed session as its student (the teacher's stamp is written by completion), completing the dual confirmation: the escrow hold is consumed and the teacher's wallet is credited exactly once. Repeat confirms, the teacher caller, and arbitration-settled rows are idempotent no-ops returning the current row. Non-participants and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials.
  """
  confirmSessionCompletion(id: ID!): Session!

  """Creates a new subscription plan in the catalog (Admin only)."""
  createPlan(
    """Input fields for the new subscription plan."""
    input: CreatePlanInput!
  ): Plan!

  """
  Book one session against a certified teacher. Student-only; the booking is idempotent per the X-Idempotency-Key request header (a replayed key surfaces DUPLICATE_REQUEST).
  """
  createSession(input: CreateSessionInput!): Session!

  """
  Authenticate with email + password. Returns the authenticated user + access + refresh tokens. The access_token + refresh_token + session_id are also set as httpOnly cookies.
  """
  login(email: String!, password: String!): LoginPayload!

  """
  Clears the access_token + refresh_token + session_id httpOnly cookies. Public — callable with an expired token. Always returns { success: true }.
  """
  logout: LogoutPayload!

  """
  Marks every unread notification of the caller read (optionally narrowed to one type) and returns the affected-row count. An empty matching set returns 0; repeat sweeps are idempotent (0).
  """
  markAllNotificationsRead(type: NotificationType): Int!

  """
  Marks one of the caller's own notifications read (idempotent) and returns the row. A foreign or nonexistent id is indistinguishable — NOTIFICATION_NOT_FOUND with no existence oracle.
  """
  markNotificationRead(id: ID!): Notification!

  """
  Open a dispute on one of the caller's scheduled/started sessions (either participant, exactly once, with a required reason). Non-participants and nonexistent ids are indistinguishable SESSION_NOT_FOUND denials; the row waits in the disputed state for admin arbitration.
  """
  openSessionDispute(id: ID!, reason: String!): Session!

  """
  Rotate the JWT pair from a valid refresh token. Returns fresh access + refresh tokens. The new access_token + refresh_token + session_id are also set as httpOnly cookies (rotation invalidates the prior pair).
  """
  refreshToken(refreshToken: String!): RefreshTokenPayload!
  registerUser(input: RegisterUserInput!): User!

  """
  Submits a parent-child link request for the student owning the handshake code. A valid-format code matching no eligible student answers null (missing and governance-excluded are indistinguishable); already-linked and already-pending targets surface their dedicated conflicts.
  """
  requestParentChildLink(code: String!): OutgoingParentLinkRequest

  """
  Request a payout from the caller's own teacher wallet: one pending withdrawal ledger row plus a guarded balance debit, atomically. Insufficient funds roll the request back (zero rows) and surface WALLET_INSUFFICIENT_FUNDS; malformed amounts fail the pre-DB validation matrix with WALLET_INVALID_AMOUNT. Returns the UPDATED wallet (balance + refreshed ledger) so no refetch is needed. Teacher-only.
  """
  requestWithdrawal(input: RequestWithdrawalInput!): Wallet!

  """
  Resolve one disputed session into exactly one terminal state (admin arbitration): Cancel refunds the held fee to its original lane, Complete consumes the hold (never-started disputes are rejected). Non-disputed rows are SESSION_INVALID_TRANSITION conflicts.
  """
  resolveSessionDispute(id: ID!, note: String, resolution: DisputeResolution!): Session!

  """
  Accepts or rejects exactly one of the caller's own pending link requests (one-directional claim). A foreign or nonexistent id is indistinguishable — PARENT_LINK_REQUEST_NOT_FOUND with no existence oracle; already-resolved and expired requests surface their dedicated conflicts.
  """
  respondToParentLinkRequest(accept: Boolean!, requestId: ID!): IncomingParentLinkRequest!

  """Activates or deactivates an existing subscription plan (Admin only)."""
  setPlanActiveStatus(
    """ID of the subscription plan."""
    id: ID!

    """Target active state for the plan."""
    isActive: Boolean!
  ): Plan!

  """
  Start one of the caller's scheduled sessions (teacher-only guarded transition).
  """
  startSession(id: ID!): Session!

  """
  Persists the caller's app locale preference (UI + notification-copy language) and returns the updated user. Idempotent. Self-scoped — identity is derived from the verified context, never from arguments.
  """
  updateMyLocale(locale: AppLocale!): User!

  """Updates mutable fields on an existing subscription plan (Admin only)."""
  updatePlan(
    """ID of the subscription plan to update."""
    id: ID!

    """Updated fields for the subscription plan."""
    input: UpdatePlanInput!
  ): Plan!
}

